# Gemeinsame Basis für lokale Entwicklung und Produktion (Task 0.3,
# erweitert um Task 1.12/D-50). Enthält "db" und "web" — beides läuft
# hier identisch, ob lokal per "docker compose up" (das automatisch
# compose.override.yaml dazuliest, siehe dort) oder auf dem Server per
# "docker compose -f compose.yaml -f compose.prod.yaml up -d".
#
# Bewusst KEINE Host-Ports hier: Wer von außen auf "web" oder "db"
# zugreifen soll (lokal: pytest/manage.py runserver ohne Docker;
# produktiv: gar niemand direkt, nur Caddy), bekommt das über die
# jeweils passende Zusatzdatei, nicht hier in der Basis.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magic_personality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magic_personality}
      POSTGRES_DB: ${POSTGRES_DB:-magic_personality}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magic_personality} -d ${POSTGRES_DB:-magic_personality}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    env_file:
      - .env
    environment:
      # Innerhalb des Compose-Netzwerks heißt die Datenbank "db", nicht
      # "localhost" — überschreibt bewusst den Wert aus .env, der für
      # die Entwicklung außerhalb von Docker (gegen den auf den Host
      # gemappten Port) gedacht ist.
      DATABASE_URL: postgres://${POSTGRES_USER:-magic_personality}:${POSTGRES_PASSWORD:-magic_personality}@db:5432/${POSTGRES_DB:-magic_personality}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import sys, urllib.request as u; sys.exit(0 if u.urlopen('http://localhost:8000/healthz').status == 200 else 1)"
      ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

volumes:
  postgres_data:
