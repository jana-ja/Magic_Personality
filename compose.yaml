# Lokales Docker Compose (Task 0.3). Kein Caddy hier — Reverse Proxy
# und TLS kommen erst mit dem echten Deployment (Task 1.12,
# ARCHITECTURE.md §2). "web" ist dasselbe Image, das später auch dort
# läuft; SECURE_SSL_REDIRECT wird unten bewusst auf False gesetzt,
# weil es lokal noch keine TLS-Terminierung gibt.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magic_personality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magic_personality}
      POSTGRES_DB: ${POSTGRES_DB:-magic_personality}
    ports:
      # Auf den Host gemappt, damit lokale Entwicklung ohne Docker
      # (manage.py runserver, pytest) gegen "docker compose up db"
      # laufen kann — genau das behauptet .env.example bereits.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-magic_personality} -d ${POSTGRES_DB:-magic_personality}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    env_file:
      - .env
    environment:
      # Innerhalb des Compose-Netzwerks heißt die Datenbank "db", nicht
      # "localhost" — überschreibt bewusst den Wert aus .env, der für
      # die Entwicklung außerhalb von Docker (gegen den auf den Host
      # gemappten Port) gedacht ist.
      DATABASE_URL: postgres://${POSTGRES_USER:-magic_personality}:${POSTGRES_PASSWORD:-magic_personality}@db:5432/${POSTGRES_DB:-magic_personality}
      SECURE_SSL_REDIRECT: "False"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import sys, urllib.request as u; sys.exit(0 if u.urlopen('http://localhost:8000/healthz').status == 200 else 1)"
      ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

volumes:
  postgres_data:
