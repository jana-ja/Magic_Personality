name: CI

# Läuft nur bei einem Push auf main (D-76, ersetzt den Auslöser aus
# Task 0.6/D-31): Feature-Branches und Pull Requests lösen nichts aus,
# geprüft und als Image veröffentlicht wird erst, was auf main landet.
# Lokal davor laufen lassen: ruff check ., ruff format --check ., pytest.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nur für CI, nie echte Geheimnisse (ARCHITECTURE.md §11.1 gilt hier
  # nicht — es gibt nichts Produktives, das dieser Wert schützen
  # müsste).
  SECRET_KEY: ci-only-not-a-real-secret
  INVITE_CODE: ci-only-not-a-real-secret
  DATABASE_URL: postgres://magic_personality:magic_personality@localhost:5432/magic_personality

jobs:
  test:
    name: Lint, checks, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: magic_personality
          POSTGRES_PASSWORD: magic_personality
          POSTGRES_DB: magic_personality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magic_personality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Dieselbe Version wie im Dockerfile (ARCHITECTURE.md §3) —
          # CI prüft damit dieselbe Laufzeit, die auch deployt wird.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff (Lint)
        run: ruff check .

      - name: Ruff (Format)
        run: ruff format --check .

      - name: Django deployment checks (prod settings)
        run: python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: example.com
          SECURE_SSL_REDIRECT: "True"

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: pytest
        run: pytest

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    # Nur hier eskaliert: das Bauen/Veröffentlichen eines Images
    # braucht packages:write, der test-Job kommt mit contents:read aus.
    # Läuft nur nach grünem test-Job (needs) — ein roter Stand auf main
    # veröffentlicht kein Image.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
